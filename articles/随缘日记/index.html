<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随缘日记 - Klece</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        @font-face {
            font-family: 'LoliFont';
            src: url('../../fonts/loli-font.ttf') format('truetype');
        }
        .loli-font, body, .article-text, .article-text * { font-family: 'LoliFont', 'Inter', system-ui, sans-serif; }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark {
            background-color: #121212;
            color: #e5e7eb;
        }

        
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../../content/background.png');
            background-size: cover;
            background-position: center;
            filter: blur(4px);
            transform: scale(1.1);
        }
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f3f4f6;
            opacity: 0.6;
        }
        .dark .bg-overlay {
            background-color: #121212;
        }
        

        .glass-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative; overflow: hidden;
        }
        .glass-panel::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, #6a11cb, transparent);
        }
        .glass-panel::before {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, #2575fc, transparent);
        }
        .glass-panel-plain {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            position: relative; overflow: hidden;
        }
        .dark .glass-panel-plain {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-glow {
            text-shadow: 0 2px 12px #6a11cb66;
        }
        /* Markdown 内容 - 日间深色，夜间白色 */
        #article-content { color: #1f2937; }
        #article-content h1, #article-content h2, #article-content h3, #article-content h4 { color: #111827; border-color: rgba(0,0,0,0.15); }
        #article-content p, #article-content li, #article-content span { color: #374151; }
        #article-content a { color: #2563eb; }
        #article-content blockquote { border-color: rgba(0,0,0,0.2); background: rgba(0,0,0,0.04); color: #4b5563; }
        #article-content code { background: rgba(0,0,0,0.08); color: #dc2626; }
        #article-content pre { background: rgba(0,0,0,0.06); }
        #article-content pre code { color: #1f2937; }
        #article-content hr { border-color: rgba(0,0,0,0.15); }
        #article-content table, #article-content th, #article-content td { border-color: rgba(0,0,0,0.15); }
        #article-content th { background: rgba(0,0,0,0.06); color: #111827; }
        #article-content td { color: #374151; }

        body.dark #article-content { color: #ffffff; }
        body.dark #article-content h1, body.dark #article-content h2, body.dark #article-content h3, body.dark #article-content h4 { color: #ffffff; border-color: rgba(255,255,255,0.3); }
        body.dark #article-content p, body.dark #article-content li, body.dark #article-content span { color: #ffffff; }
        body.dark #article-content a { color: #93c5fd; }
        body.dark #article-content blockquote { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); color: #ffffff; }
        body.dark #article-content code { background: rgba(255,255,255,0.15); color: #fca5a5; }
        body.dark #article-content pre { background: rgba(0,0,0,0.7); }
        body.dark #article-content pre code { color: #e5e7eb; }
        body.dark #article-content hr { border-color: rgba(255,255,255,0.2); }
        body.dark #article-content table, body.dark #article-content th, body.dark #article-content td { border-color: rgba(255,255,255,0.2); }
        body.dark #article-content th { background: rgba(255,255,255,0.1); color: #ffffff; }
        body.dark #article-content td { color: #ffffff; }
        #article-content img { border-radius: 0.5rem; }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 min-h-screen">
    
    <div class="bg-container">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
    </div>
    

    <!-- 顶部标题区域 -->
    <header class="pt-12 pb-6">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto text-center animate-fade-in">
                <a href="../" class="inline-flex items-center text-white/60 hover:text-white/90 transition-colors mb-4 text-sm">
                    <i class="fa-solid fa-arrow-left mr-2"></i>返回文章列表
                </a>
                <h1 class="text-3xl font-bold header-glow text-white" style="font-family:'LoliFont','Inter',system-ui,sans-serif;">
                    <i class="fa-solid fa-file-lines mr-3"></i>随缘日记
                </h1>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 pb-16">
        <div class="max-w-4xl mx-auto animate-fade-in">
            <div class="glass-panel-plain rounded-2xl p-8">
                <div class="article-text max-w-none" id="article-content" style="font-family:'LoliFont','Inter',system-ui,sans-serif;">
                    <h1 id="_1">日记</h1>
<p>-2026.6.6
- 买了两件衣服</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark');
        }
        function applyStyles() {
            const c = document.getElementById('article-content');
            if (!c) return;
            c.querySelectorAll('h1').forEach(e => { if (!e.style.fontFamily) e.style.cssText += ';font-family:LoliFont,Inter,system-ui,sans-serif;' });
            c.querySelectorAll('h2, h3, h4, p, li, span').forEach(e => { if (!e.style.fontFamily) e.style.cssText += ';font-family:LoliFont,Inter,system-ui,sans-serif;' });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyStyles);
        else applyStyles();
    </script>
</body>
</html>
